<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Camera with BG Remove</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  h2 {
    margin: 10px 0;
  }
  video, canvas {
    border-radius: 12px;
    max-width: 95%;
    margin: 10px auto;
    display: block;
  }
  button {
    padding: 10px 15px;
    font-size: 16px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #0af;
    color: #000;
  }
  button:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<h2>🤖 AI Camera – Background Remove (TensorFlow.js)</h2>

<video id="video" autoplay playsinline></video>
<canvas id="output"></canvas>

<div>
  <button id="startBtn">📷 Start Camera</button>
  <button id="downloadBtn">📥 Download</button>
</div>

<!-- TensorFlow.js এবং BodyPix মডেল লোড -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>
<script src="script.js"></script>
</body>
</html>
