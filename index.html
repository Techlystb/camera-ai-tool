<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera to ImgBB Upload</title>
<style>
/*body{background:#111;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:10px;}*/
h2{margin:10px 0;}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
select,button{padding:8px 12px;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
select{background:#333;color:#fff;}
#captureBtn{background:#0af;color:#000;}
#uploadBtn{background:#fa0;color:#000;}
#downloadBtn{background:#0f0;color:#000;display:none;}
video,canvas,img{max-width:95%;border-radius:12px;margin:10px auto;display:block;}
#status{margin-top:10px;font-weight:bold;}
</style>
</head>
<body>

<h2>📷 Take a picture from your camera and upload it to ImgBB.</h2>

<div class="controls">
  <select id="cameraSelect">
    <option value="user">🤳 Front Camera</option>
    <option value="environment">📸 Back Camera</option>
  </select>
 <select id="sizeSelect">
  <option value="640x480">640x480 (VGA)</option>
  <option value="800x600">800x600 (SVGA)</option>
  <option value="1024x768">1024x768 (XGA)</option>
  <option value="1280x720">1280x720 (HD)</option>
  <option value="1280x960">1280x960</option>
  <option value="1600x1200">1600x1200 (UXGA)</option>
  <option value="1920x1080">1920x1080 (Full HD)</option>
  <option value="2560x1440">2560x1440 (2K QHD)</option>
  <option value="3840x2160">3840x2160 (4K UHD)</option>
  <option value="4096x2160">4096x2160 (DCI 4K)</option>
  <option value="720x1280">720x1280 (Portrait HD)</option>
  <option value="1080x1920">1080x1920 (Portrait Full HD)</option>
  <option value="1440x2560">1440x2560 (Portrait 2K)</option>
  <option value="2160x3840">2160x3840 (Portrait 4K)</option>
</select>

</div>
  
  
  
  
<div class="controls">
  <select id="presetSelect">
    <option value="normal">🎞️ Normal</option>
    <option value="warm">🌅 Warm</option>
    <option value="cool">❄️ Cool</option>
    <option value="hdr">🌟 HDR</option>
    <option value="teal">🎨 Teal LUT</option>
    <option value="retro">📺 Retro</option>
    <option value="bw">🖤 B&W</option>
    <option value="sketch">✏️ Sketch</option>
    <option value="cartoon">🖌️ Cartoon</option>
    <option value="emboss">💎 Emboss</option>
    <option value="edge">📐 Edge Detect</option>

  </select>
</div>

  
  
  

<div class="controls">
  <select id="filterSelect">
    <option value="none">Normal</option>
    <option value="grayscale(100%)">Grayscale</option>
    <option value="sepia(80%)">Sepia</option>
    <option value="contrast(150%)">Contrast</option>
    <option value="brightness(150%)">Bright</option>
    <option value="blur(3px)">Blur</option>
    <option value="invert(100%)">Invert</option>
    <option value="saturate(200%)">Saturate</option>
    <option value="hue-rotate(90deg)">Hue Rotate</option>
  </select>
  

  <button id="captureBtn">📷 Take a picture.</button>
</div>

<video id="camera" autoplay playsinline></video>
<canvas id="snapshot" style="display:none;"></canvas>
<img id="preview">
<h3>📌 Preview:</h3>
<img id="preview" alt="Captured Image">

<div id="status"></div>

  
  
  <button id="uploadBtn" disabled>📤 Upload to ImgBB</button>
  <button id="downloadBtn">📥 Download</button>
  
<div id="status"></div>
<button id="copyBtn" style="display:none;margin-top:10px;padding:8px 12px;border:none;border-radius:6px;background:#08f;color:#fff;cursor:pointer;">
📋 Copy link
</button>
  
<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>
<script src="script.js"></script>
</body>
</html>
