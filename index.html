<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Camera Tool</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:10px;}
h2{margin:10px 0;}
select,button{padding:8px 12px;border:none;border-radius:6px;font-size:14px;margin:4px;cursor:pointer;}
select{background:#333;color:#fff;}
button{background:#0af;color:#000;font-weight:bold;}
button:disabled{background:#555;color:#999;}
video,canvas,img{max-width:95%;border-radius:12px;margin:10px auto;display:block;}
.container{position:relative;display:inline-block;}
#frameOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#status{margin-top:10px;font-weight:bold;}
#copyBtn{display:none;margin-top:10px;padding:8px 12px;border:none;border-radius:6px;background:#08f;color:#fff;cursor:pointer;}
</style>
</head>
<body>

<h2>🤖 AI Camera Tool</h2>

<div>
  <select id="cameraSelect">
    <option value="user">🤳 Front Camera</option>
    <option value="environment">📸 Back Camera</option>
  </select>
  <select id="sizeSelect">
    <option value="640x480">640x480</option>
    <option value="1280x720">1280x720</option>
    <option value="1920x1080">1920x1080</option>
  </select>
</div>

<div>
  <select id="filterSelect">
    <option value="normal">🎞 Normal</option>
    <option value="warm">🌅 Warm</option>
    <option value="cool">❄️ Cool</option>
    <option value="hdr">🌟 HDR</option>
    <option value="bw">🖤 B&W</option>
    <option value="ai">🤖 AI BG Remove</option>
  </select>
</div>

<div>
  <button id="captureBtn">📷 Capture</button>
  <button id="downloadBtn" style="display:none;">📥 Download</button>
  <button id="uploadBtn" disabled>📤 Upload ImgBB</button>
</div>

<div class="container">
  <video id="video" autoplay playsinline></video>
  <img id="frameOverlay" src="https://i.ibb.co/6bYwV5t/sample-frame.png" alt="Frame">
</div>

<canvas id="canvas" style="display:none;"></canvas>
<img id="preview" style="display:none;">

<div id="status"></div>
<button id="copyBtn">📋 Copy Link</button>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>
<script src="script.js"></script>
</body>
</html>
